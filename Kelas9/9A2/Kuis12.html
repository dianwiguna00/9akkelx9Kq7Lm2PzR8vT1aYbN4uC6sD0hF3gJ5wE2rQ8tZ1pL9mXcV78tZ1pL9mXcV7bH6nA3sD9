<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Matematika</title>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#74ebd5,#ACB6E5);
margin:0;
text-align:center;
}

.container{
max-width:950px;
margin:20px auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.timer{
font-size:24px;
font-weight:bold;
color:#d9534f;
margin-bottom:10px;
}

.score-board{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:15px;
}

.team{
padding:12px;
background:#f0f0f0;
border-radius:10px;
font-size:18px;
}

.active{
background:#c8f7c5;
font-weight:bold;
}

.question{
  font-size:24px;
  text-align:left;
  margin:10px 0;
  white-space: pre-line;
}

.options{
margin-top:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.optionBtn{
padding:15px;
font-size:20px;
border:none;
border-radius:12px;
cursor:pointer;
color:white;
font-weight:bold;
}

.btnA{background:#1E88E5;}
.btnB{background:#43A047;}
.btnC{background:#FB8C00;}
.btnD{background:#8E24AA;}

.correct{background:#2ecc71!important;}
.wrong{background:#e74c3c!important;}

button{
margin:5px;
padding:10px 20px;
border:none;
border-radius:10px;
background:#4CAF50;
color:white;
font-size:16px;
cursor:pointer;
}

.feedback{
font-size:22px;
font-weight:bold;
margin-top:10px;
}

.pembahasan{
display:none;
margin-top:15px;
padding:15px;
background:#f9fbff;
border-left:5px solid #2196F3;
text-align:left;
border-radius:10px;
}
.close{
float:right;
cursor:pointer;
color:red;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h1>🎮 Kuis Matematika</h1>
<h3>Penerapan Bangun Ruang Sisi Lengkung dalam Desain dan Konstruksi</h3>

<div class="timer" id="timer">Waktu: 60:00</div>

<div class="score-board">
<div id="team1" class="team active"></div>
<div id="team2" class="team"></div>
<div id="team3" class="team"></div>
<div id="team4" class="team"></div>
</div>

<div id="questionNumber"></div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>

<button onclick="nextQuestion()">Soal Berikut</button>
<button onclick="switchTeam()">Ganti Regu</button>
<button onclick="showPembahasan()">📘 Pembahasan</button>

<div id="feedback" class="feedback"></div>

<div id="pembahasan" class="pembahasan">
<span class="close" onclick="closePembahasan()">✖</span>
<b>Pembahasan</b>
<div id="pembahasanText"></div>
</div>
</div>

<script>
let questions=[
{q:"Sebuah tabung digunakan sebagai wadah tepung. Jika jari-jari tabung 7 cm dan tingginya 20 cm, maka volume tabung tersebut adalah …",options:["2.500π cm³","980π cm³","1.540π cm³","3.080π cm³"],correct:"980π cm³",p:"Volume tabung dihitung dengan rumus V = πr²t. Dengan r = 7 cm dan t = 20 cm diperoleh V = π × 49 × 20 = 980π cm³.",img:""},
{q:"Sebuah pabrik membuat penutup speaker berbentuk bola dengan jari-jari 10 cm. Luas permukaan satu penutup speaker tersebut adalah …",options:["200π cm²","400π cm²","800π cm²","1.200π cm²"],correct:"400π cm²",p:"Luas permukaan bola dihitung dengan rumus L = 4πr². Dengan r = 10 cm diperoleh L = 4π × 100 = 400π cm². Jawaban yang benar adalah 400π cm².",img:""},
{q:"Sebuah corong berbentuk kerucut memiliki tinggi 15 cm dan jari-jari 4 cm. Volume corong tersebut adalah …",options:["80π cm³","100π cm³","160π cm³","240π cm³"],correct:"80π cm³",p:"Volume kerucut dihitung dengan rumus V = 1/3 πr²t. Dengan r = 4 cm dan t = 15 cm diperoleh V = 1/3 × π × 16 × 15 = 80π cm³.",img:""},
{q:"Sebuah tangki air berbentuk tabung memiliki tinggi 1,5 m dan volume 0,942 m³. Jari-jari tangki air tersebut adalah …",options:["0,25 m","0,40 m","0,45 m","0,50 m"],correct:"0,40 m",p:"Gunakan rumus volume tabung V = πr²t. Diketahui 0,942 = π × r² × 1,5 sehingga r² = 0,942 / (1,5π) ≈ 0,20 dan r ≈ 0,40 m.",img:""},
{q:"Sebuah bola hias dengan jari-jari 12 cm akan dicat seluruh permukaannya. Banyaknya luas permukaan yang harus dicat adalah …",options:["288π cm²","576π cm²","864π cm²","1.152π cm²"],correct:"576π cm²",p:"Luas permukaan bola dihitung dengan rumus L = 4πr². Dengan r = 12 cm diperoleh L = 4π × 144 = 576π cm².",img:""},
{q:"Perhatikan pernyataan berikut:\n1) Bentuk kerucut memudahkan aliran fluida.\n2) Bola memiliki distribusi tekanan merata.\n3) Tabung tidak dapat digunakan sebagai wadah cairan.\n4) Tabung efisien untuk penyimpanan.\nPernyataan yang benar adalah …",options:["1, 2, dan 3","1, 2, dan 4","1 dan 3","2 dan 4"],correct:"1, 2, dan 4",p:"Pernyataan benar adalah (1) kerucut memudahkan aliran fluida, (2) bola memiliki distribusi tekanan merata, dan (4) tabung efisien sebagai wadah penyimpanan. Pernyataan (3) salah karena tabung justru sering digunakan sebagai wadah cairan.",img:""}

];

let currentQuestion=0;
let scores=[0,0,0,0];
let wrongs=[0,0,0,0];
let currentTeam=0;
let answered=new Array(questions.length).fill(false);
let quizFinished=false;

function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}}

function showQuestion(){
if(quizFinished) return;

let q=questions[currentQuestion];
let opsi=[...q.options];
shuffle(opsi);

q.correctIndex=opsi.indexOf(q.correct);
q.correctLetter=String.fromCharCode(65+q.correctIndex);

document.getElementById("question").textContent=q.q;
document.getElementById("questionNumber").textContent=
`Soal ${currentQuestion+1} dari ${questions.length}`;

let html="";
opsi.forEach((o,i)=>{
let letter=String.fromCharCode(65+i);
let btnClass=["btnA","btnB","btnC","btnD"][i];
html+=`<button class="optionBtn ${btnClass}"
onclick="checkAnswer('${letter}','${o}',this)">
${letter}. ${o}</button>`;
});
document.getElementById("options").innerHTML=html;
document.getElementById("feedback").textContent="";
closePembahasan();
}

function checkAnswer(letter,text,btn){
if(quizFinished) return;

let q=questions[currentQuestion];
document.querySelectorAll(".optionBtn").forEach(b=>b.disabled=true);

if(text===q.correct){
btn.classList.add("correct");
scores[currentTeam]++;
answered[currentQuestion]=true;
document.getElementById("feedback").textContent="✅ Benar";
}else{
btn.classList.add("wrong");
wrongs[currentTeam]++;
document.getElementById("feedback").textContent="❌ Salah";
}

updateScore();

setTimeout(()=>{
if(answered.every(v=>v)){
endQuiz();
}else nextQuestion();
},800);
}

function nextQuestion(){
let start=currentQuestion;
do{
currentQuestion=(currentQuestion+1)%questions.length;
}while(answered[currentQuestion] && currentQuestion!==start);
showQuestion();
}

function endQuiz(){
quizFinished=true;
clearInterval(timer);
document.getElementById("question").innerHTML="🏁 <b>KUIS SELESAI</b>";
document.getElementById("options").innerHTML="";
document.getElementById("feedback").innerHTML=showWinners();
}

function showWinners(){
let rank=[0,1,2,3].map(i=>({
team:i+1,
score:scores[i]-wrongs[i]
}));
rank.sort((a,b)=>b.score-a.score);

let html="<h2>🏆 Pengumuman Juara</h2>";
rank.forEach((r,i)=>{
html+=`<p>Juara ${i+1}: <b>Regu ${r.team}</b> (Skor ${r.score})</p>`;
});
return html;
}

function updateScore(){
for(let i=0;i<4;i++){
document.getElementById("team"+(i+1)).textContent=
`Regu ${i+1} | Benar: ${scores[i]} | Salah: ${wrongs[i]} | Skor: ${scores[i]-wrongs[i]}`;
}}

function switchTeam(){
document.getElementById("team"+(currentTeam+1)).classList.remove("active");
currentTeam=(currentTeam+1)%4;
document.getElementById("team"+(currentTeam+1)).classList.add("active");
}

function showPembahasan(){
document.getElementById("pembahasanText").textContent=
questions[currentQuestion].p;
document.getElementById("pembahasan").style.display="block";
}

function closePembahasan(){
document.getElementById("pembahasan").style.display="none";
}

let timeLeft=3600;
let timer=setInterval(()=>{
let m=Math.floor(timeLeft/60);
let s=timeLeft%60;
if(s<10)s="0"+s;
document.getElementById("timer").textContent=`Waktu: ${m}:${s}`;
timeLeft--;
if(timeLeft<0){
document.getElementById("timer").textContent="⏰ Waktu Habis";
endQuiz();
}},1000);

shuffle(questions);
updateScore();
showQuestion();
</script>


</body>
</html>
